name: Bug Report
description: Report a reproducible problem with the CLI, template, or plugin bundles.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include webhook URLs, device IDs, API tokens, response JSON, screenshots with private data, raw prompts, logs, email/calendar content, customer data, or local file bodies.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Use synthetic payloads only.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version Or Commit
  - type: textarea
    id: validation
    attributes:
      label: Validation Output
      description: Paste redacted output from `./scripts/validate-release.sh` or a synthetic dry run.
