<div class="layout layout--col gap--small">
  <div class="item">
    <div class="meta"></div>
    <div class="content">
      <span class="label label--underline">{{ title | default: "AGENT NOW" }}</span>
      <span class="title">{{ state | default: "WATCH" }}</span>
    </div>
  </div>

  <div class="item">
    <div class="meta"></div>
    <div class="content">
      <span class="label">STATUS</span>
      <span class="description">{{ headline | default: "Waiting for the next agent update" }}</span>
    </div>
  </div>

  <div class="item">
    <div class="meta"></div>
    <div class="content">
      <span class="label">NEXT</span>
      <span class="description">{{ next | default: "Idle" }}</span>
    </div>
  </div>

  <div class="item">
    <div class="meta"></div>
    <div class="content">
      <span class="label">{{ source | default: "agent" }}</span>
      <span class="description">{{ updated | default: "not updated" }}</span>
    </div>
  </div>
</div>
