[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trmnl-agent-bridge"
version = "0.1.0"
description = "Publish local agent status snapshots to TRMNL Private Plugin webhooks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "John Rauser" }
]
keywords = ["trmnl", "codex", "claude-code", "agents", "webhook", "e-ink"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Utilities"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jrausercisco/trmnl-agent-bridge"
Issues = "https://github.com/jrausercisco/trmnl-agent-bridge/issues"

[project.scripts]
trmnl-agent = "trmnl_agent_bridge.cli:main"
trmnl-codex = "trmnl_agent_bridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/trmnl_agent_bridge"]
